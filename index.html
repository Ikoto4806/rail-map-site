<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中国城市轨道交通线网图 · 高清图库</title>
<style>
  :root{
    --bg:#0e1116; --panel:#151a22; --panel2:#1b2230; --line:#242e3d;
    --txt:#e6edf5; --dim:#8b9bb0; --accent:#3d8bfd; --accent2:#1f6feb;
    --badge:#233044;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--txt); display:flex; height:100vh; overflow:hidden;
    font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  }
  /* ---------- sidebar ---------- */
  aside{
    width:280px; flex:0 0 280px; background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; height:100%;
  }
  .brand{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
  .brand h1{font-size:15px;margin:0 0 3px;letter-spacing:.4px}
  .brand p{margin:0;color:var(--dim);font-size:12px}
  .search{padding:9px 12px;border-bottom:1px solid var(--line)}
  .search input{
    width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);outline:none;font-size:13px;
  }
  .search input:focus{border-color:var(--accent2)}
  .tree{flex:1;overflow-y:auto;padding:8px 8px 40px}
  .tree::-webkit-scrollbar{width:8px}
  .tree::-webkit-scrollbar-thumb{background:#26303f;border-radius:4px}
  .prov{margin-top:5px}
  .prov>button{
    width:100%;display:flex;align-items:center;gap:6px;justify-content:space-between;
    background:none;border:0;color:var(--dim);font-size:12px;font-weight:600;
    padding:6px 8px;border-radius:6px;cursor:pointer;letter-spacing:.5px;
  }
  .prov>button:hover{background:var(--panel2);color:var(--txt)}
  .prov .cnt{font-weight:400;opacity:.7}
  .cities{display:flex;flex-direction:column;gap:1px;padding:2px 0 4px}
  .cities.hide{display:none}
  .city{
    display:flex;align-items:center;gap:8px;background:none;border:0;text-align:left;
    color:var(--txt);padding:6px 10px 6px 16px;border-radius:6px;cursor:pointer;font-size:13px;
    width:100%;
  }
  .city:hover{background:var(--panel2)}
  .city.active{background:var(--accent2);color:#fff}
  .city .dot{width:5px;height:5px;border-radius:50%;background:var(--dim);flex:0 0 5px}
  .city.active .dot{background:#fff}
  .city .mini{margin-left:auto;font-size:10px;color:var(--dim)}
  .city.active .mini{color:#cfe3ff}
  /* ---------- main ---------- */
  main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
  header{
    padding:11px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;
    gap:12px;flex-wrap:wrap;background:var(--panel);
  }
  header .title{font-size:16px;font-weight:600}
  header .prov-tag{
    font-size:11px;color:var(--dim);border:1px solid var(--line);padding:2px 8px;border-radius:20px;
  }
  header .spacer{flex:1}
  .btn{
    background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:6px 11px;
    border-radius:7px;cursor:pointer;font-size:12.5px;
  }
  .btn:hover{border-color:var(--accent2);color:#fff}
  .btn.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .credit{
    font-size:12px;color:#7ea6db;text-decoration:none;border:1px solid #2b3f58;
    background:#16202e;padding:5px 10px;border-radius:7px;white-space:nowrap;
  }
  .credit:hover{color:#cfe3ff;border-color:var(--accent2);background:#1b2a3e}
  .meta{padding:7px 18px;color:var(--dim);font-size:12px;border-bottom:1px solid var(--line);
        display:flex;gap:14px;flex-wrap:wrap;align-items:center;min-height:36px}
  .cross{display:inline-flex;align-items:center;gap:5px;background:var(--badge);
         border:1px solid #2f4055;padding:2px 9px;border-radius:20px;color:#a9c7ff}
  .stage{flex:1;position:relative;overflow:hidden;background:
      radial-gradient(circle at 30% 20%, #141a24 0%, #0b0e13 70%)}
  /* ---------- gallery ---------- */
  .gallery{
    position:absolute;inset:0;overflow-y:auto;padding:18px 20px 60px;
  }
  .gallery::-webkit-scrollbar{width:10px}
  .gallery::-webkit-scrollbar-thumb{background:#26303f;border-radius:5px}
  .gsec{margin-bottom:26px}
  .gsec h3{
    margin:0 0 10px;font-size:13px;font-weight:600;color:#9fb3cc;letter-spacing:1px;
    display:flex;align-items:center;gap:10px;
  }
  .gsec h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .ggrid{
    display:grid;gap:12px;
    grid-template-columns:repeat(auto-fill,minmax(196px,1fr));
  }
  .card{
    background:#121821;border:1px solid var(--line);border-radius:9px;overflow:hidden;
    cursor:pointer;padding:0;text-align:left;color:var(--txt);display:flex;flex-direction:column;
    transition:border-color .15s, transform .15s;
  }
  .card:hover{border-color:var(--accent2);transform:translateY(-2px)}
  .card .ph{
    width:100%;aspect-ratio:4/3;background:#f4f5f7;display:flex;align-items:center;
    justify-content:center;overflow:hidden;
  }
  .card .ph img{width:100%;height:100%;object-fit:contain;display:block}
  .card .cap{padding:7px 10px;display:flex;align-items:baseline;gap:6px}
  .card .cap b{font-weight:600;font-size:13.5px}
  .card .cap em{margin-left:auto;font-style:normal;font-size:10.5px;color:var(--dim)}
  .card .tag{
    font-size:10px;color:#7fd18b;border:1px solid #2c4a34;background:#16241a;
    padding:0 5px;border-radius:4px;
  }
  /* ---------- detail ---------- */
  .canvas{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
          cursor:grab;overflow:hidden}
  .canvas.grabbing{cursor:grabbing}
  .canvas img{
    max-width:96%;max-height:96%;transform-origin:center center;
    box-shadow:0 12px 50px rgba(0,0,0,.65);border-radius:4px;background:#fff;
    user-select:none;-webkit-user-drag:none;
  }
  .hint{position:absolute;left:16px;bottom:14px;color:var(--dim);font-size:12px;
        background:rgba(10,13,18,.75);padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
  .zoomctl{position:absolute;right:16px;bottom:14px;display:flex;gap:6px}
  /* lightbox */
  .lb{position:fixed;inset:0;background:rgba(5,7,10,.96);display:none;z-index:50;flex-direction:column}
  .lb.show{display:flex}
  .lb .bar{padding:10px 16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #1c2431}
  .lb .bar .t{font-size:14px}
  .lb .bar .s{color:var(--dim);font-size:12px}
  .lb .view{flex:1;overflow:auto;display:block;padding:20px;text-align:center}
  .lb img{max-width:none;background:#fff}
  @media (max-width:820px){
    aside{position:absolute;z-index:20;height:100%;transform:translateX(-100%);transition:.2s}
    aside.open{transform:none}
    body{display:block}
    main{height:100vh}
    .ggrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  }
</style>
</head>
<body>
<aside id="sidebar">
  <div class="brand">
    <h1>中国城市轨道交通线网图</h1>
    <p><span id="stat"></span> · 高清原图 · 本地保存</p>
  </div>
  <div class="search"><input id="q" placeholder="搜索城市 / 省份，如 苏州、广东"></div>
  <div class="tree" id="tree"></div>
</aside>

<main>
  <header>
    <button class="btn" id="menuBtn" style="display:none">目录</button>
    <span class="title" id="cName">全部城市线网图</span>
    <span class="prov-tag" id="cProv"></span>
    <span class="spacer"></span>
    <a class="credit" href="https://www.metroman.cn/maps" target="_blank" rel="noopener"
       title="线网图来源：地铁通 MetroMan">图源：metroman.cn</a>
    <button class="btn" id="btnBack" style="display:none">返回总览</button>
    <button class="btn" id="btnFit" style="display:none">适应窗口</button>
    <button class="btn" id="btnFull" style="display:none">全屏大图</button>
  </header>
  <div class="meta" id="meta">共 50 座城市的轨道交通线网高清图，点击任意图片查看大图。</div>
  <div class="stage">
    <div class="gallery" id="gallery"></div>
    <div class="canvas" id="canvas" style="display:none"></div>
    <div class="hint" id="hint" style="display:none">滚轮缩放 · 拖动平移 · 双击复位</div>
    <div class="zoomctl" id="zoomctl" style="display:none">
      <button class="btn" id="zin">＋</button>
      <button class="btn" id="zout">－</button>
      <button class="btn" id="zreset">1:1</button>
    </div>
  </div>
</main>

<div class="lb" id="lb">
  <div class="bar">
    <span class="t" id="lbTitle"></span>
    <span class="s" id="lbSub"></span>
    <span style="flex:1"></span>
    <button class="btn" id="lbClose">关闭 (Esc)</button>
  </div>
  <div class="view" id="lbView"><img id="lbImg" alt=""></div>
</div>

const state = { city:null, scale:1, tx:0, ty:0, fit:true };

function buildTree(){
  const tree = document.getElementById('tree');
  tree.innerHTML = '';
  DATA.forEach(g=>{
    const wrap = document.createElement('div');
    wrap.className = 'prov';
    wrap.dataset.prov = g.province;
    const b = document.createElement('button');
    b.innerHTML = `<span>${g.province}</span><span class="cnt">${g.cities.length}</span>`;
    const box = document.createElement('div');
    box.className = 'cities';
    g.cities.forEach(c=>{
      const el = document.createElement('button');
      el.className = 'city';
      el.dataset.id = c.id;
      el.dataset.name = c.name + ' ' + g.province;
      el.innerHTML = `<span class="dot"></span><span>${c.name}</span><span class="mini">${c.w}×${c.h}</span>`;
      el.onclick = ()=>selectCity(c, g.province);
      box.appendChild(el);
    });
    b.onclick = ()=> box.classList.toggle('hide');
    wrap.appendChild(b); wrap.appendChild(box);
    tree.appendChild(wrap);
  });
  document.getElementById('stat').textContent =
    DATA.reduce((a,g)=>a+g.cities.length,0) + ' 城 · ' + DATA.length + ' 省级区划';
}

function buildGallery(){
  const gal = document.getElementById('gallery');
  gal.innerHTML = '';
  DATA.forEach(g=>{
    const sec = document.createElement('div');
    sec.className = 'gsec';
    sec.dataset.prov = g.province;
    const h = document.createElement('h3');
    h.textContent = g.province + ' · ' + g.cities.length;
    sec.appendChild(h);
    const grid = document.createElement('div');
    grid.className = 'ggrid';
    g.cities.forEach(c=>{
      const card = document.createElement('button');
      card.className = 'card';
      card.dataset.id = c.id;
      card.dataset.name = c.name + ' ' + g.province;
      card.innerHTML =
        `<div class="ph"><img loading="lazy" src="${c.thumb}" alt="${c.name}轨道交通线网图"></div>` +
        `<div class="cap"><b>${c.name}</b>` +
        (c.official ? `<span class="tag">官网原图</span>` : '') +
        `<em>${c.w}×${c.h}</em></div>`;
      card.onclick = ()=>selectCity(c, g.province);
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    gal.appendChild(sec);
  });
}

function showGallery(){
  state.city = null;
  document.getElementById('gallery').style.display = 'block';
  document.getElementById('canvas').style.display = 'none';
  document.getElementById('hint').style.display = 'none';
  document.getElementById('zoomctl').style.display = 'none';
  document.getElementById('btnBack').style.display = 'none';
  document.getElementById('btnFit').style.display = 'none';
  document.getElementById('btnFull').style.display = 'none';
  document.getElementById('cName').textContent = '全部城市线网图';
  document.getElementById('cProv').textContent = '';
  const n = DATA.reduce((a,g)=>a+g.cities.length,0);
  document.getElementById('meta').innerHTML =
    `共 ${n} 座城市的轨道交通线网高清图，点击任意图片查看大图。`;
  document.querySelectorAll('.city').forEach(e=>e.classList.remove('active'));
}

function selectCity(c, prov){
  state.city = c; state.fit = true; state.scale = 1; state.tx = 0; state.ty = 0;
  document.querySelectorAll('.city').forEach(e=>e.classList.toggle('active', e.dataset.id === c.id));
  document.getElementById('cName').textContent = c.name + '轨道交通线网图';
  document.getElementById('cProv').textContent = prov;
  const meta = document.getElementById('meta');
  const cross = (c.cross && c.cross.length)
    ? c.cross.map(x=>`<span class="cross">⇄ ${x}</span>`).join(' ') : '';
  const note = c.note ? `<span>${c.note}</span>` : '';
  meta.innerHTML = `${cross}
     <span>尺寸 ${c.w} × ${c.h}</span>
     <span>${c.kb} KB</span>
     ${c.source ? `<span>来源：${c.source}</span>` : ''}
     ${c.updated ? `<span>版本：${c.updated}</span>` : ''} ${note}`;

  document.getElementById('gallery').style.display = 'none';
  const canvas = document.getElementById('canvas');
  canvas.style.display = 'flex';
  canvas.classList.add('fit');
  canvas.innerHTML = `<img id="bigimg" src="${c.img}" alt="${c.name}轨道交通线网图">`;
  document.getElementById('hint').style.display = 'block';
  document.getElementById('zoomctl').style.display = 'flex';
  document.getElementById('btnBack').style.display = 'inline-block';
  document.getElementById('btnFit').style.display = 'inline-block';
  document.getElementById('btnFull').style.display = 'inline-block';
  const img = document.getElementById('bigimg');
  img.onload = ()=>apply();
  img.ondblclick = ()=>{ state.fit=true; canvas.classList.add('fit'); apply(); };

  canvas.onwheel = ev=>{
    ev.preventDefault();
    state.fit = false; canvas.classList.remove('fit');
    const f = ev.deltaY < 0 ? 1.15 : 1/1.15;
    state.scale = Math.min(14, Math.max(0.08, state.scale * f));
    apply();
  };
  let drag = null;
  canvas.onmousedown = ev=>{
    if(ev.button!==0) return;
    drag = {x:ev.clientX, y:ev.clientY, tx:state.tx, ty:state.ty};
    canvas.classList.add('grabbing');
    state.fit = false; canvas.classList.remove('fit');
    ev.preventDefault();
  };
  window.onmousemove = ev=>{
    if(!drag) return;
    state.tx = drag.tx + (ev.clientX - drag.x);
    state.ty = drag.ty + (ev.clientY - drag.y);
    apply();
  };
  window.onmouseup = ()=>{ drag=null; canvas.classList.remove('grabbing'); };
  window.scrollTo(0,0);
}

function apply(){
  const img = document.getElementById('bigimg');
  if(!img) return;
  if(state.fit){
    img.style.transform = '';
    img.style.maxWidth = '96%';
    img.style.maxHeight = '96%';
  }else{
    img.style.maxWidth = 'none';
    img.style.maxHeight = 'none';
    img.style.transform = `translate(${state.tx}px, ${state.ty}px) scale(${state.scale})`;
  }
}

document.getElementById('btnBack').onclick = showGallery;
document.getElementById('btnFit').onclick = ()=>{
  state.fit = true;
  document.getElementById('canvas').classList.add('fit');
  apply();
};
document.getElementById('zin').onclick = ()=>{ state.fit=false; document.getElementById('canvas').classList.remove('fit'); state.scale=Math.min(14,state.scale*1.3); apply(); };
document.getElementById('zout').onclick = ()=>{ state.fit=false; document.getElementById('canvas').classList.remove('fit'); state.scale=Math.max(0.08,state.scale/1.3); apply(); };
document.getElementById('zreset').onclick = ()=>{ state.fit=false; document.getElementById('canvas').classList.remove('fit'); state.scale=1; state.tx=0; state.ty=0; apply(); };

document.getElementById('btnFull').onclick = ()=>{
  if(!state.city) return;
  const lb = document.getElementById('lb');
  document.getElementById('lbTitle').textContent = state.city.name + '轨道交通线网图';
  document.getElementById('lbSub').textContent = `${state.city.w}×${state.city.h} · ${state.city.kb}KB · 滚动查看原始分辨率`;
  const im = document.getElementById('lbImg');
  im.src = state.city.img;
  im.style.width = Math.min(state.city.w, screen.width * 1.6) + 'px';
  lb.classList.add('show');
};
document.getElementById('lbClose').onclick = ()=>document.getElementById('lb').classList.remove('show');
window.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    document.getElementById('lb').classList.remove('show');
    if(document.getElementById('lb').classList.contains('show')===false && state.city) showGallery();
  }
  if(e.key==='f' || e.key==='F') document.getElementById('btnFull').click();
});

document.getElementById('q').oninput = ev=>{
  const k = ev.target.value.trim().toLowerCase();
  document.querySelectorAll('.prov').forEach(w=>{
    let shown = 0;
    w.querySelectorAll('.city').forEach(c=>{
      const hit = !k || c.dataset.name.toLowerCase().includes(k);
      c.style.display = hit ? '' : 'none';
      if(hit) shown++;
    });
    w.style.display = shown ? '' : 'none';
    w.querySelector('.cities').classList.remove('hide');
  });
  document.querySelectorAll('.gsec').forEach(sec=>{
    let shown = 0;
    sec.querySelectorAll('.card').forEach(card=>{
      const hit = !k || card.dataset.name.toLowerCase().includes(k);
      card.style.display = hit ? '' : 'none';
      if(hit) shown++;
    });
    sec.style.display = shown ? '' : 'none';
  });
};

document.getElementById('menuBtn').onclick = ()=>document.getElementById('sidebar').classList.toggle('open');
function resp(){ document.getElementById('menuBtn').style.display = window.innerWidth<=820?'inline-block':'none'; }
window.addEventListener('resize', resp); resp();

buildTree();
buildGallery();
showGallery();
</script>
</body>
</html>
